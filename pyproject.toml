[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "virtual-world"
version = "0.1.0"
description = "A reproducible island colony and local research lab"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "numpy>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
virtual-world = "virtual_world.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
